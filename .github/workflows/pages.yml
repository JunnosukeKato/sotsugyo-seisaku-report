# main に送るたびに、テストしてからビルドし、GitHub Pages に公開する（学生用ツール）
name: GitHub Pages に公開

on:
  push:
    branches: [main]
  workflow_dispatch:

# 全体は読むだけ。公開に要る権限（pages・id-token）は、公開する deploy のジョブだけに付ける
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

# 使う部品（actions）は、タグではなくコミットの SHA で固定する（タグを付け替えられても、知らないプログラムが動かないように）。
# 更新するときは、新しいタグが指す SHA を調べて書き換える（例：gh api repos/actions/checkout/commits/v4 --jq .sha）
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
