<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>v8 学生の最初の画面 案1 カードから選ぶ</title>
<link rel="stylesheet" href="./start.css">
<style>
  .wrap { max-width: 1080px; margin: 0 auto; padding: 48px 32px 40px; display: flex; flex-direction: column; gap: 22px; min-height: 100%; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .card { position: relative; text-align: left; background: #fff; border: 1.5px solid transparent; border-radius: 16px; padding: 18px 20px 16px; box-shadow: var(--float-shadow); transition: border-color 0.15s, transform 0.15s; }
  .card:hover { transform: translateY(-2px); }
  .card.on { border-color: var(--accent); }
  .card .radio { position: absolute; top: 18px; right: 18px; width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid #c9c6c0; }
  .card.on .radio { border-color: var(--accent); background: radial-gradient(var(--accent) 0 5px, #fff 6px); }
  .card .name { font-size: 16px; font-weight: 700; letter-spacing: 0.04em; padding-right: 30px; word-break: keep-all; overflow-wrap: anywhere; }
  .card .name small { font-weight: 400; color: var(--muted); margin-left: 4px; }
  .card .cap { font-size: 11px; color: var(--muted); margin: 12px 0 4px; padding-top: 10px; border-top: 1px solid var(--line); letter-spacing: 0.06em; }
  .foot { display: flex; align-items: center; gap: 18px; margin-top: 6px; }
  @media (max-width: 600px) {
    .wrap { padding: 24px 16px 28px; gap: 16px; }
    h1.q { font-size: 21px; }
    .cards { grid-template-columns: 1fr; gap: 10px; }
    .card { padding: 14px 16px; }
    .card .cap, .card .outline .sub, .card .outline .item { display: none; }
    .card .outline { margin-top: 6px; font-size: 12px; line-height: 1.7; }
    .foot { flex-direction: column; align-items: stretch; gap: 10px; text-align: center; }
    .start-btn { justify-content: center; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand-row"><span class="mark">卒</span><div><div class="brand-name">卒業制作報告書</div><div class="brand-sub">2026年度</div></div></div>
  <span class="step" style="align-self:flex-start">はじめに</span>
  <h1 class="q">所属するコースを選んでください</h1>
  <p class="lead">選んだコースに合わせて、本文の下書き（章立てと、それぞれに書くことの説明）を用意します。<br>表紙と抄録のコース名も入ります。</p>
  <div class="cards" id="cards"></div>
  <div class="foot">
    <button class="start-btn" id="go" disabled>このコースで始める <span aria-hidden="true">→</span></button>
    <span class="note">コースはあとから変えられます（下書きを入れ替えるときは確認します）</span>
  </div>
</div>
<script type="module">
  import '../fonts.ts'
  import { COURSES, numbered } from './data.js'
  const cards = document.getElementById('cards')
  cards.innerHTML = COURSES.map((c) => `
    <button class="card" data-id="${c.id}">
      <span class="radio"></span>
      <div class="name">${c.name}<small>コース</small></div>
      <div class="cap">下書きの章立て</div>
      <ul class="outline">${numbered(c.blocks).filter((b) => b.type === 'chapter' || b.type === 'sub').map((b) => `<li class="${b.type === 'sub' ? 'sub' : ''}">${b.label}</li>`).join('')}</ul>
    </button>`).join('')
  const select = (id) => {
    cards.querySelectorAll('.card').forEach((el) => el.classList.toggle('on', el.dataset.id === id))
    document.getElementById('go').disabled = false
  }
  cards.querySelectorAll('.card').forEach((el) => el.addEventListener('click', () => select(el.dataset.id)))
  select('film')
</script>
</body>
</html>
