<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>v8 学生の最初の画面 案2 下書きを見ながら選ぶ</title>
<link rel="stylesheet" href="./start.css">
<link rel="stylesheet" href="./paper.css">
<style>
  .split { height: 100%; display: grid; grid-template-columns: 440px 1fr; }
  .left { background: var(--panel-bg); border-right: 1px solid var(--line); padding: 36px 32px 28px; display: flex; flex-direction: column; gap: 18px; overflow: auto; }
  .list { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
  .opt { display: flex; align-items: center; gap: 12px; text-align: left; padding: 13px 14px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; }
  .opt .radio { width: 20px; height: 20px; flex: none; border-radius: 50%; border: 1.5px solid #c9c6c0; }
  .opt.on { border-color: var(--accent); background: var(--accent-soft); }
  .opt.on .radio { border-color: var(--accent); background: radial-gradient(var(--accent) 0 5px, #fff 6px); }
  .opt b { display: block; font-size: 15px; letter-spacing: 0.03em; }
  .opt span.meta { font-size: 11.5px; color: var(--muted); }
  .left .foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
  .left .start-btn { justify-content: center; }
  .right { position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; padding: 22px 0; gap: 10px; }
  .right .cap { font-size: 12px; color: var(--muted); letter-spacing: 0.06em; }
  .right .cap b { color: var(--ink); }
  .right .paper-box { box-shadow: 0 1px 3px rgba(30, 25, 20, 0.08), 0 20px 60px rgba(30, 25, 20, 0.16); }
  .legend { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); }
  .legend i { width: 26px; height: 0; border-top: 2px solid #b5b7bc; }
  @media (max-width: 600px) {
    .split { display: block; height: auto; }
    .left { border: 0; padding: 22px 16px 8px; gap: 14px; }
    h1.q { font-size: 21px; }
    .right { padding: 6px 0 20px; }
    .left .foot { position: sticky; bottom: 0; background: var(--panel-bg); padding: 10px 0 12px; }
  }
</style>
</head>
<body>
<div class="split">
  <section class="left">
    <div class="brand-row"><span class="mark">卒</span><div><div class="brand-name">卒業制作報告書</div><div class="brand-sub">2026年度</div></div></div>
    <span class="step" style="align-self:flex-start">はじめに</span>
    <h1 class="q">所属するコースを<br>選んでください</h1>
    <p class="lead">コースごとに、本文の下書き（章立てと、それぞれに書くことの説明）が違います。下書きの中身を確かめてから始められます。</p>
    <div class="list" id="list"></div>
    <div class="foot">
      <button class="start-btn" id="go">このコースで始める <span aria-hidden="true">→</span></button>
      <span class="note">コースはあとから変えられます（下書きを入れ替えるときは確認します）</span>
    </div>
  </section>
  <section class="right" id="right">
    <div class="cap">（見本）<b id="cname"></b> コースの下書き　本文1ページ目</div>
    <div class="paper-box" id="box"></div>
    <span class="legend"><i></i>薄い字は「書くことの説明」です（PDFには出ません）</span>
  </section>
</div>
<script type="module">
  import '../fonts.ts'
  import { COURSES, draftPage } from './data.js'
  const list = document.getElementById('list')
  const box = document.getElementById('box')
  const right = document.getElementById('right')
  list.innerHTML = COURSES.map((c) => {
    const chapters = c.blocks.filter((b) => b.type === 'chapter').length
    return `<button class="opt" data-id="${c.id}"><span class="radio"></span><span><b>${c.name} コース</b><span class="meta">大見出し${chapters}つ　${c.blocks.filter((b) => b.type === 'chapter').map((b) => b.title).join('・')}</span></span></button>`
  }).join('')
  const fit = () => {
    const narrow = innerWidth <= 600
    const s = narrow ? (innerWidth - 32) / 794 : Math.min((right.clientWidth - 80) / 794, (right.clientHeight - 90) / 1123)
    box.style.width = `${794 * s}px`
    box.style.height = `${1123 * s}px`
    const paper = box.querySelector('.paper')
    if (paper) paper.style.transform = `scale(${s})`
  }
  const select = (id) => {
    const c = COURSES.find((x) => x.id === id)
    list.querySelectorAll('.opt').forEach((el) => el.classList.toggle('on', el.dataset.id === id))
    document.getElementById('cname').textContent = c.name
    box.innerHTML = draftPage(c)
    fit()
  }
  list.querySelectorAll('.opt').forEach((el) => el.addEventListener('click', () => select(el.dataset.id)))
  addEventListener('resize', fit)
  select('film')
</script>
</body>
</html>
