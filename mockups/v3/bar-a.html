<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>v3 案A 上のバーの中身を右の欄へ</title>
<link rel="stylesheet" href="../v2/common.css">
<link rel="stylesheet" href="./v3.css">
<style>
  .head { display: flex; flex-direction: column; gap: 4px; }
  .head .links { display: flex; gap: 6px; margin-top: 4px; }
  .foot { padding: 12px 14px; border-top: 1px solid var(--line); background: #fff; }
  .foot small { display: block; margin-top: 6px; font-size: 11px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<div class="app">
  <div class="toolbox" id="tools"></div>
  <section class="stage" id="stage">
    <div class="book" id="book"></div>
    <button class="nav-arrow prev" id="prev" aria-label="前のページ">←</button>
    <button class="nav-arrow next" id="next" aria-label="次のページ">→</button>
  </section>
  <aside class="side" id="side"></aside>
</div>
<script type="module">
  import '../fonts.ts'
  import { ICONS, PAGES_BOX, CHECK_BOX, start } from './v3.js'
  document.getElementById('side').innerHTML = `
    <section class="head">
      <div class="brand">卒業制作報告書<small>2026年度</small></div>
      <div class="status">✓ 自動保存しました（14:32）</div>
      <div class="deadline-line">最終締切 1月20日（水）まで <b>あと107日</b></div>
      <div class="links"><button class="btn sm">${ICONS.handbook}手順書</button><button class="btn sm">${ICONS.backup}バックアップ</button></div>
    </section>
    ${PAGES_BOX}
    ${CHECK_BOX}
    <div class="foot"><button class="btn primary big">${ICONS.pdf}PDFを書き出す</button><small>エラーを0にしてから書き出しましょう</small></div>`
  start({ top: 16, bottom: 16, side: 75 })
</script>
</body>
</html>
